name: Deploy Zelbi

on:
  push:
    branches:
      - main
  # Lets the admin panel's "Deploy now" button start a deploy
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      # -------------------------
      # Checkout
      # -------------------------
      - name: Checkout Repository
        uses: actions/checkout@v6

      # -------------------------
      # Setup Node.js
      # -------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # -------------------------
      # Backend
      # -------------------------
      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      # -------------------------
      # Frontend
      # -------------------------
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        env:
          CI: false
          NODE_OPTIONS: --max-old-space-size=1024
        run: npm run build

      # -------------------------
      # Deploy to EC2
      # -------------------------
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        env:
          # Full contents of each .env file, stored as multi-line repository secrets
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
          FRONTEND_ENV: ${{ secrets.FRONTEND_ENV }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          envs: BACKEND_ENV,FRONTEND_ENV
          script: |
            set -e

            echo "Go to project..."
            cd ${{ secrets.PROJECT_PATH }}

            echo "Pull latest code..."
            git pull origin main

            # Write .env files from GitHub secrets. If a secret is empty, keep the
            # existing file on the server rather than wiping production config.
            echo "Write environment files..."
            umask 077
            if [ -n "$BACKEND_ENV" ]; then
              printf '%s\n' "$BACKEND_ENV" > backend/.env
            else
              echo "BACKEND_ENV secret is empty, keeping existing backend/.env"
            fi
            if [ -n "$FRONTEND_ENV" ]; then
              printf '%s\n' "$FRONTEND_ENV" > frontend/.env
            else
              echo "FRONTEND_ENV secret is empty, keeping existing frontend/.env"
            fi
            umask 022

            echo "Backend..."
            cd backend

            npm install

            pm2 restart zelbi-backend

            cd ..

            echo "Frontend..."

            cd frontend

            npm install

            export NODE_OPTIONS="--max-old-space-size=1024"
            export CI=false

            npm run build

            sudo rm -rf /var/www/html/*
            sudo cp -r build/* /var/www/html/

            sudo systemctl reload nginx

            pm2 save

            echo "Deployment completed successfully."
